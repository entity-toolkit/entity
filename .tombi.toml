toml-version = "v1.0.0"

[format]
  [format.rules]
    indent-sub-tables = true
    indent-table-key-value-pairs = true
    trailing-comment-alignment = true

[schema]
  enabled = true
  strict = true

[[schemas]]
  path = "entity.schema.json"
  include = ["**/*.toml"]
  exclude = [
    ".tombi.toml",
    "extern/**",               # submodules: adios2's pyproject/REUSE, entity-pgens' own configs
    ".venv/**",
    "build/**",
    "**/*.ckpt/**",            # checkpoint metadata dumps carry a [metadata] table, not input
  ]
